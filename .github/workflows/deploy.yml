# yusin.co.kr 배포 — main 에 푸시하면 GitHub Pages 로 올라간다.
#
# Next 공식 템플릿(github.com/nextjs/deploy-github-pages)을 이 저장소에 맞춰
# 고친 것이다. 바꾼 곳은 셋이다.
#   - pnpm -> npm (여기는 package-lock.json 을 쓴다)
#   - Node 22 -> 24 (로컬 빌드를 검증한 버전)
#   - PAGES_BASE_PATH 제거. 그 값은 user.github.io/저장소이름 으로 띄울 때
#     basePath 를 맞추라고 주는 것인데, 우리는 yusin.co.kr 을 최상위로 쓰므로
#     basePath 가 없다. next.config.ts 도 그 값을 읽지 않는다.
#
# 빌드 결과는 out/ 이고, postbuild(fix-segment-prefetch.mjs)까지 끝난 뒤
# 통째로 올린다. public/ 안의 CNAME 과 .nojekyll 도 함께 복사된다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 손으로도 돌릴 수 있게 해 둔다(사진만 바꿨을 때 등).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것은 끊지 않는다 — 운영 배포라
# 중간에 멈추면 어느 버전이 올라가 있는지 알 수 없게 된다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # .next/cache 를 살려 두면 두 번째부터 빌드가 짧아진다.
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # npm run build 가 끝나면 postbuild 가 이어서 돈다(package.json).
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
